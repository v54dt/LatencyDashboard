<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest 1 Hour - Dashboard</title>
    <script src="https://unpkg.com/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.30/dist/uPlot.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 20px;
            background: #f8fafc;
            color: #1a202c;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }

        .chart-container {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
        }

        #chart {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stats-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 16px;
            background: #f7fafc;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2b6cb0;
        }

        .stat-label {
            color: #4a5568;
            font-size: 14px;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .time-range {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .legend {
            margin-top: 10px;
            min-height: 32px; /* reserve pill row height even when empty */
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            font-size: 0.9em;
            border: 1px solid transparent;
            border-radius: 999px;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.15s, border-color 0.15s, background 0.15s;
        }

        .legend-item:hover {
            background: #edf2f7;
        }

        .legend-item.active {
            border-color: #2b6cb0;
            background: #ebf4ff;
            font-weight: 600;
        }

        .legend.has-selection .legend-item:not(.active) {
            opacity: 0.4;
        }

        .legend-color {
            width: 16px;
            height: 3px;
            border-radius: 2px;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Latest 1 Hour</h1>
            <p>Last 1 hour (UTC+8)</p>
        </div>

        <div class="controls">
            <div style="margin-left: auto;">
                <span id="lastUpdate" class="time-range"></span>
            </div>
        </div>

        <div class="chart-container">
            <div id="loading" class="loading">Loading latency data...</div>
            <div id="chart" style="display: none;"></div>
            <div id="legend" class="legend"></div>
        </div>

        <div class="stats-container" id="statsContainer">
            <!-- Stats will be populated by JavaScript -->
        </div>
    </div>

    <script>
        let chart = null;
        let chartData = null;
        let refreshInterval = null;

        // State retained across refreshes so the broker filter survives auto-refresh.
        let latestRawData = [];
        let latestBrokers = [];
        let brokerColors = {}; // broker -> stroke color
        let selectedBroker = null;

        const CHART_WIDTH = 1280;
        const CHART_HEIGHT = 720;
        const REFRESH_INTERVAL_MS = 30000;
        const ONE_HOUR_SECONDS = 3600;
        const FIVE_MIN_SECONDS = 300;

        const colors = [
            '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6',
            '#1abc9c', '#34495e', '#e67e22', '#fd79a8', '#00b894'
        ];

        const taipeiTimeFormatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Taipei',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });

        function formatTime(epochSeconds) {
            return taipeiTimeFormatter.format(new Date(epochSeconds * 1000));
        }

        function arrayMax(arr) {
            let m = -Infinity;
            for (let i = 0; i < arr.length; i++) if (arr[i] > m) m = arr[i];
            return m;
        }

        function percentile(sortedAsc, p) {
            if (sortedAsc.length === 0) return 0;
            const idx = Math.min(sortedAsc.length - 1, Math.ceil(sortedAsc.length * p) - 1);
            return sortedAsc[Math.max(0, idx)];
        }

        function createEmptyChart() {
            const chartContainer = document.getElementById('chart');

            if (chart) chart.destroy();

            const now = Date.now() / 1000;
            const start = now - ONE_HOUR_SECONDS;
            const timestamps = [];

            for (let t = start; t <= now; t += FIVE_MIN_SECONDS) {
                timestamps.push(t);
            }

            const plotData = [timestamps, Array(timestamps.length).fill(null)];
            const series = [
                { label: 'Time' },
                { label: '', stroke: '#e0e0e0', width: 0, scale: 'ms' }
            ];

            const opts = {
                title: "Latest 1 Hour",
                width: CHART_WIDTH,
                height: CHART_HEIGHT,
                legend: { show: false },
                series: series,
                scales: {
                    x: { auto: true },
                    ms: { auto: true, range: [0, 100] }
                },
                axes: [
                    {
                        values: (self, ticks) => ticks.map(formatTime)
                    },
                    {
                        scale: 'ms',
                        values: (self, ticks) => ticks.map(t => `${t.toFixed(1)}ms`)
                    }
                ],
                padding: [20, 40, 20, 60]
            };

            chart = new uPlot(opts, plotData, chartContainer);
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/order-metrics/timeseries');
                const rawData = await response.json();

                if (rawData.length === 0) {
                    latestRawData = [];
                    latestBrokers = [];
                    brokerColors = {};
                    selectedBroker = null;
                    createEmptyChart();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('chart').style.display = 'block';
                    document.getElementById('legend').innerHTML = '';
                    document.getElementById('legend').classList.remove('has-selection');
                    renderStats();
                    updateLastUpdate();
                    return;
                }

                // Group data by broker
                const brokerData = {};
                const timestamps = new Set();

                rawData.forEach(row => {
                    if (!brokerData[row.broker]) {
                        brokerData[row.broker] = {};
                    }
                    brokerData[row.broker][row.timestamp] = row.total_ms;
                    timestamps.add(row.timestamp);
                });

                // Convert to sorted array
                const sortedTimestamps = Array.from(timestamps).sort((a, b) => a - b);
                const brokers = Object.keys(brokerData).sort();

                // Prepare uPlot data format
                const plotData = [sortedTimestamps];
                const series = [{
                    label: 'Time'
                }];

                brokers.forEach((broker, index) => {
                    const brokerValues = sortedTimestamps.map(ts =>
                        brokerData[broker][ts] || null
                    );
                    plotData.push(brokerValues);

                    series.push({
                        label: broker,
                        stroke: colors[index % colors.length],
                        width: 2,
                        scale: 'ms',
                        value: (self, rawValue) => rawValue == null ? null : `${rawValue.toFixed(1)}ms`
                    });
                });

                latestRawData = rawData;
                latestBrokers = brokers;
                brokerColors = {};
                brokers.forEach((b, i) => { brokerColors[b] = colors[i % colors.length]; });

                // If the previously-selected broker disappeared from the new data, clear the filter.
                if (selectedBroker && !brokers.includes(selectedBroker)) {
                    selectedBroker = null;
                }

                chartData = plotData;
                createChart(chartData, series);
                renderStats();
                updateLastUpdate();

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('loading').innerHTML = 'Error loading data';
            }
        }

        function createChart(data, series) {
            const chartContainer = document.getElementById('chart');

            if (chart) chart.destroy();

            const now = Date.now() / 1000;
            const start = now - ONE_HOUR_SECONDS;

            const opts = {
                title: "Latest 1 Hour",
                width: CHART_WIDTH,
                height: CHART_HEIGHT,
                legend: { show: false },
                series: series,
                scales: {
                    x: { auto: true, min: start, max: now },
                    ms: { auto: true }
                },
                axes: [
                    {
                        values: (self, ticks) => ticks.map(formatTime)
                    },
                    {
                        scale: 'ms',
                        values: (self, ticks) => ticks.map(t => `${t.toFixed(1)}ms`)
                    }
                ],
                padding: [20, 40, 20, 60]
            };

            chart = new uPlot(opts, data, chartContainer);

            document.getElementById('loading').style.display = 'none';
            chartContainer.style.display = 'block';

            renderLegend();
            applyChartFilter(); // re-apply after chart was rebuilt by refresh
        }

        function applyChartFilter() {
            if (!chart) return;
            latestBrokers.forEach((broker, idx) => {
                const seriesIdx = idx + 1; // series[0] is the time axis
                const shouldShow = selectedBroker === null || selectedBroker === broker;
                chart.setSeries(seriesIdx, { show: shouldShow });
            });
        }

        function renderLegend() {
            const legend = document.getElementById('legend');
            legend.innerHTML = '';
            legend.classList.toggle('has-selection', selectedBroker !== null);

            latestBrokers.forEach(broker => {
                const item = document.createElement('div');
                item.className = 'legend-item' + (broker === selectedBroker ? ' active' : '');
                item.title = 'Click to filter stats to this broker';
                item.innerHTML = `
                    <div class="legend-color" style="background-color: ${brokerColors[broker]}"></div>
                    <span>${broker}</span>
                `;
                item.addEventListener('click', () => {
                    selectedBroker = (selectedBroker === broker) ? null : broker;
                    renderLegend();
                    renderStats();
                    applyChartFilter();
                });
                legend.appendChild(item);
            });
        }

        function renderStats() {
            const statsContainer = document.getElementById('statsContainer');

            const filtered = selectedBroker
                ? latestRawData.filter(r => r.broker === selectedBroker)
                : latestRawData;

            if (filtered.length === 0) {
                statsContainer.innerHTML = `
                    <div class="stat-item">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Total Samples</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">0.00ms</div>
                        <div class="stat-label">Average Latency</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">0.00ms</div>
                        <div class="stat-label">Max Latency</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">0.00ms</div>
                        <div class="stat-label">99th Percentile</div>
                    </div>
                `;
                return;
            }

            const latencies = filtered.map(r => r.total_ms);
            const avg = latencies.reduce((a, b) => a + b, 0) / latencies.length;
            const max = arrayMax(latencies);
            const sortedAsc = latencies.slice().sort((a, b) => a - b);
            const p99 = percentile(sortedAsc, 0.99);

            statsContainer.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${latencies.length.toLocaleString()}</div>
                    <div class="stat-label">Total Samples</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${avg.toFixed(2)}ms</div>
                    <div class="stat-label">Average Latency</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${max.toFixed(2)}ms</div>
                    <div class="stat-label">Max Latency</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${p99.toFixed(2)}ms</div>
                    <div class="stat-label">99th Percentile</div>
                </div>
            `;
        }

        function updateLastUpdate() {
            document.getElementById('lastUpdate').textContent =
                `Last updated: ${formatTime(Date.now() / 1000)} (UTC+8)`;
        }

        function startAutoRefresh() {
            refreshInterval = setInterval(fetchData, REFRESH_INTERVAL_MS);
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        window.addEventListener('resize', () => {
            if (!chart) return;
            const container = document.getElementById('chart');
            const width = Math.min(CHART_WIDTH, container.clientWidth || CHART_WIDTH);
            chart.setSize({ width, height: CHART_HEIGHT });
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
            startAutoRefresh();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', stopAutoRefresh);
    </script>
</body>

</html>
