<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Metric Breakdown - Dashboard</title>
    <script src="https://unpkg.com/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.30/dist/uPlot.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 20px;
            background: #f8fafc;
            color: #1a202c;
        }

        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2c3e50; margin-bottom: 10px; }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }

        .chart-container {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
        }

        #chart { display: flex; justify-content: center; align-items: center; }

        .stats-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-item { text-align: center; padding: 16px; background: #f7fafc; border-radius: 8px; }
        .stat-value { font-size: 24px; font-weight: bold; color: #2b6cb0; }
        .stat-label { color: #4a5568; font-size: 14px; margin-top: 4px; }
        .stat-sub { font-size: 12px; color: #718096; margin-top: 4px; }

        .loading { text-align: center; padding: 40px; color: #7f8c8d; }
        .time-range { color: #7f8c8d; font-size: 0.9em; }

        .broker-picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .broker-picker .label { color: #4a5568; font-size: 0.9em; }
        .broker-picker .pill {
            padding: 4px 12px;
            font-size: 0.9em;
            border: 1px solid #cbd5e0;
            border-radius: 999px;
            cursor: pointer;
            user-select: none;
            background: white;
            transition: background 0.15s, border-color 0.15s;
        }
        .broker-picker .pill:hover { background: #edf2f7; }
        .broker-picker .pill.active {
            border-color: #2b6cb0;
            background: #ebf4ff;
            font-weight: 600;
        }

        table.outcome-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }
        table.outcome-table th, table.outcome-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }
        table.outcome-table th { color: #4a5568; font-weight: 600; background: #f7fafc; }
        table.outcome-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Order Metric Breakdown</h1>
            <p>Trading hours 08:00–14:00 (UTC+8)</p>
        </div>

        <div class="controls">
            <div class="broker-picker">
                <span class="label">Broker:</span>
                <div id="brokerPills"></div>
            </div>
            <div style="margin-left: auto;">
                <span id="lastUpdate" class="time-range"></span>
            </div>
        </div>

        <div class="chart-container">
            <div id="loading" class="loading">Loading...</div>
            <div id="chart" style="display: none;"></div>
        </div>

        <div class="stats-container" id="statsContainer"></div>

        <div class="chart-container">
            <h3 style="margin: 0 0 12px 0; color: #2c3e50;">Outcome distribution</h3>
            <table class="outcome-table" id="outcomeTable"></table>
        </div>
    </div>

    <script>
        const CHART_WIDTH = 1280;
        const CHART_HEIGHT = 720;
        const REFRESH_INTERVAL_MS = 30000;
        const WINDOW_START_HOUR = 8;
        const WINDOW_END_HOUR = 14;

        // Series colors — sdk_local intentionally muted (it's < 1ms).
        const SERIES_COLORS = {
            sdk_local_ms: '#9b59b6',
            ack_rtt_ms:   '#e74c3c',
            cancel_rtt_ms:'#3498db',
            tcp_rtt_ms:   '#2ecc71', // tcp_rtt_us / 1000
        };

        let chart = null;
        let refreshInterval = null;
        let latestRawData = [];
        let brokers = [];
        let selectedBroker = null;

        const taipeiTimeFormatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Taipei',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
        });

        function formatTime(epochSeconds) {
            return taipeiTimeFormatter.format(new Date(epochSeconds * 1000));
        }

        function taipeiTodayAtHourEpoch(hour) {
            const now = new Date();
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Taipei',
                year: 'numeric', month: '2-digit', day: '2-digit',
            }).formatToParts(now).reduce((acc, p) => {
                if (p.type !== 'literal') acc[p.type] = p.value;
                return acc;
            }, {});
            const utcMs = Date.UTC(+parts.year, +parts.month - 1, +parts.day, hour, 0, 0);
            return Math.floor((utcMs - 8 * 3600 * 1000) / 1000);
        }

        function percentile(sortedAsc, p) {
            if (sortedAsc.length === 0) return 0;
            const idx = Math.min(sortedAsc.length - 1, Math.ceil(sortedAsc.length * p) - 1);
            return sortedAsc[Math.max(0, idx)];
        }

        function mean(arr) {
            if (arr.length === 0) return 0;
            return arr.reduce((a, b) => a + b, 0) / arr.length;
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/order-metrics/breakdown');
                latestRawData = await response.json();

                const brokerSet = new Set(latestRawData.map(r => r.broker));
                brokers = Array.from(brokerSet).sort();
                if (!selectedBroker || !brokerSet.has(selectedBroker)) {
                    selectedBroker = brokers[0] || null;
                }

                renderBrokerPills();
                render();
                updateLastUpdate();
            } catch (err) {
                console.error('Failed to fetch order metrics:', err);
            }
        }

        function renderBrokerPills() {
            const container = document.getElementById('brokerPills');
            container.innerHTML = '';
            brokers.forEach(b => {
                const pill = document.createElement('span');
                pill.className = 'pill' + (b === selectedBroker ? ' active' : '');
                pill.textContent = b;
                pill.addEventListener('click', () => {
                    selectedBroker = b;
                    renderBrokerPills();
                    render();
                });
                container.appendChild(pill);
            });
        }

        function render() {
            const rows = latestRawData.filter(r => r.broker === selectedBroker);
            renderChart(rows);
            renderStats(rows);
            renderOutcomeTable(rows);
        }

        function renderChart(rows) {
            const chartContainer = document.getElementById('chart');
            if (chart) chart.destroy();

            const start = taipeiTodayAtHourEpoch(WINDOW_START_HOUR);
            const end = taipeiTodayAtHourEpoch(WINDOW_END_HOUR);

            // Successful rows only — failure rows have null timing.
            const successRows = rows.filter(r => r.outcome === 'success');
            const timestamps = successRows.map(r => r.timestamp);
            const sdkLocal = successRows.map(r => r.sdk_local_ms);
            const ackRtt = successRows.map(r => r.ack_rtt_ms);
            const cancelRtt = successRows.map(r => r.cancel_rtt_ms);
            const tcpRtt = successRows.map(r => r.tcp_rtt_us != null ? r.tcp_rtt_us / 1000 : null);

            const plotData = [timestamps, sdkLocal, ackRtt, cancelRtt, tcpRtt];

            const opts = {
                title: `${selectedBroker || ''} — stage breakdown`,
                width: CHART_WIDTH,
                height: CHART_HEIGHT,
                series: [
                    { label: 'Time' },
                    { label: 'sdk_local_ms', stroke: SERIES_COLORS.sdk_local_ms, width: 1.5, scale: 'ms' },
                    { label: 'ack_rtt_ms',   stroke: SERIES_COLORS.ack_rtt_ms,   width: 2,   scale: 'ms' },
                    { label: 'cancel_rtt_ms',stroke: SERIES_COLORS.cancel_rtt_ms,width: 2,   scale: 'ms' },
                    { label: 'tcp_rtt (kernel)', stroke: SERIES_COLORS.tcp_rtt_ms, width: 1.5, dash: [6, 4], scale: 'ms' },
                ],
                scales: {
                    x: { range: [start, end] },
                    ms: { auto: true },
                },
                axes: [
                    { values: (self, ticks) => ticks.map(formatTime) },
                    { scale: 'ms', values: (self, ticks) => ticks.map(t => `${t.toFixed(1)}ms`) },
                ],
                padding: [20, 40, 20, 60],
            };

            chart = new uPlot(opts, plotData, chartContainer);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('chart').style.display = 'block';
        }

        function renderStats(rows) {
            const stats = document.getElementById('statsContainer');
            const successRows = rows.filter(r => r.outcome === 'success');

            function statBlock(label, values, fmt = v => `${v.toFixed(2)}ms`) {
                const sorted = [...values].sort((a, b) => a - b);
                const p50 = percentile(sorted, 0.5);
                const p95 = percentile(sorted, 0.95);
                const p99 = percentile(sorted, 0.99);
                return `
                    <div class="stat-item">
                        <div class="stat-value">${fmt(p50)}</div>
                        <div class="stat-label">${label} (p50)</div>
                        <div class="stat-sub">p95 ${fmt(p95)} · p99 ${fmt(p99)}</div>
                    </div>
                `;
            }

            const sdkLocal = successRows.map(r => r.sdk_local_ms).filter(v => v != null);
            const ackRtt = successRows.map(r => r.ack_rtt_ms).filter(v => v != null);
            const cancelRtt = successRows.map(r => r.cancel_rtt_ms).filter(v => v != null);
            const total = successRows.map(r => r.total_ms).filter(v => v != null);

            const successRate = rows.length > 0
                ? (100 * successRows.length / rows.length).toFixed(1) + '%'
                : '—';

            stats.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${successRate}</div>
                    <div class="stat-label">Success rate</div>
                    <div class="stat-sub">${successRows.length} / ${rows.length} iterations</div>
                </div>
                ${statBlock('total_ms', total)}
                ${statBlock('sdk_local_ms', sdkLocal, v => `${v.toFixed(3)}ms`)}
                ${statBlock('ack_rtt_ms', ackRtt)}
                ${statBlock('cancel_rtt_ms', cancelRtt)}
            `;
        }

        function renderOutcomeTable(rows) {
            const table = document.getElementById('outcomeTable');
            const counts = {};
            rows.forEach(r => {
                counts[r.outcome] = (counts[r.outcome] || 0) + 1;
            });
            const ordered = ['success', 'ack_timeout', 'submit_error', 'cancel_timeout', 'cancel_error'];
            const total = rows.length;

            let html = '<thead><tr><th>Outcome</th><th class="num">Count</th><th class="num">%</th></tr></thead><tbody>';
            ordered.forEach(o => {
                const n = counts[o] || 0;
                const pct = total > 0 ? (100 * n / total).toFixed(2) : '0.00';
                html += `<tr><td>${o}</td><td class="num">${n}</td><td class="num">${pct}%</td></tr>`;
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        function updateLastUpdate() {
            const el = document.getElementById('lastUpdate');
            el.textContent = 'Last update: ' + new Date().toLocaleTimeString('en-US', { hour12: false });
        }

        fetchData();
        refreshInterval = setInterval(fetchData, REFRESH_INTERVAL_MS);
    </script>
</body>

</html>
